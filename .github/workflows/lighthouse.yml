name: Lighthouse CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Landing pages exist only for real groups with offers — take live ones from the tested host's
      # sitemap instead of hardcoded slugs (which correctly 404 when nobody offers that service).
      - name: Pick URLs
        id: urls
        run: |
          BASE=https://dev.lokalni-pl-web.pages.dev
          LANDINGS=$(curl -sfL "$BASE/sitemap-landings.xml" | grep -o '<loc>[^<]*' | sed 's|<loc>https://mylokalni.pl/||' | head -2 || true)
          [ -z "$LANDINGS" ] && echo "::warning::No landing URLs found in sitemap-landings.xml"
          {
            echo 'list<<EOF'
            echo "$BASE/"
            echo "$BASE/faq"
            for s in $LANDINGS; do echo "$BASE/$s"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.urls.outputs.list }}
          # lhci config with assertions (was wired as budgetPath → "Cannot use both budgets AND assertions",
          # so thresholds were never checked)
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
