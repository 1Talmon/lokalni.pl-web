name: Lighthouse CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Landing pages exist only for real groups with offers (API /public/landings) — pick live ones
      # instead of hardcoded slugs, which correctly return 404 when nobody offers that service.
      - name: Pick URLs
        id: urls
        run: |
          BASE=https://dev.lokalni-pl-web.pages.dev
          SLUGS=$(curl -sf https://api.mylokalni.pl/api/public/landings | jq -r '[.data[] | select(.type=="category")][0].slug, [.data[] | select(.type=="category-city")][0].slug' | grep -v null || true)
          {
            echo 'list<<EOF'
            echo "$BASE/"
            echo "$BASE/faq"
            for s in $SLUGS; do echo "$BASE/$s"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.urls.outputs.list }}
          budgetPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
