name: Lighthouse CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Landing pages exist only for real groups with offers — take live ones from the tested host's
      # sitemap instead of hardcoded slugs (which correctly 404 when nobody offers that service).
      - name: Pick URLs
        id: urls
        run: |
          BASE=https://dev.lokalni-pl-web.pages.dev
          # Browser UA: plain curl from CI IPs can be challenged by Cloudflare; hard timeout so CI never hangs
          HTTP=$(curl -sSL --max-time 20 -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/130 Safari/537.36" -o sitemap.xml -w '%{http_code}' "$BASE/sitemap-landings.xml" || echo "timeout")
          echo "sitemap-landings.xml: HTTP $HTTP"
          LANDINGS=$(grep -o '<loc>[^<]*' sitemap.xml 2>/dev/null | sed 's|<loc>https://mylokalni.pl/||' | head -2 || true)
          [ -z "$LANDINGS" ] && echo "::warning::No landing URLs found in sitemap-landings.xml"
          {
            echo 'list<<EOF'
            echo "$BASE/"
            echo "$BASE/faq"
            echo "$BASE/wpisy"
            for s in $LANDINGS; do echo "$BASE/$s"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.urls.outputs.list }}
          # lhci config with assertions (was wired as budgetPath → "Cannot use both budgets AND assertions",
          # so thresholds were never checked)
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
